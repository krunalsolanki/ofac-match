name: API image

# Builds the self-hosted REST API image on every change, so a broken Dockerfile is caught early.
# Publishes it to GitHub Container Registry (ghcr.io/krunalsolanki/ofacmatch-api) only when a
# release is published, or when run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/docker-api.yml"]
  pull_request:
    paths: ["src/**", ".github/workflows/docker-api.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ofacmatch-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OfacMatch.Api/Dockerfile
          load: true
          tags: ofacmatch-api:test

      # Start the image with a tiny fictional list and check it answers before publishing anything.
      - name: Smoke test
        run: |
          mkdir -p /tmp/sdn
          printf '100,"DOE, John",individual,SDGT,-0- ,-0- ,-0- ,-0- ,-0- ,-0- ,-0- ,-0- \r\n' > /tmp/sdn/SDN.CSV
          : > /tmp/sdn/ALT.CSV
          : > /tmp/sdn/ADD.CSV
          docker run -d --name api -p 8080:8080 -v /tmp/sdn:/data:ro -e OFACMATCH_DATA_DIR=/data ofacmatch-api:test
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf -X POST http://localhost:8080/v1/screen -H 'Content-Type: application/json' -d '{"name":"John Doe"}' | tee /tmp/out.json
          grep -q '"potentialMatches":1' /tmp/out.json
          docker logs api

      - name: Publish
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OfacMatch.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
