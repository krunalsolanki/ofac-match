name: Publish

# Runs when a GitHub release is published, e.g. tag v0.1.1.
# Logs in to nuget.org with Trusted Publishing, so no API key is stored in the repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets NuGet/login get a short-lived key for this run

jobs:
  publish:
    runs-on: windows-latest # .NET Framework 4.8 tests only run on Windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Stop before publishing if the release tag and the package version disagree.
      - name: Check version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for project in src/OfacMatch/OfacMatch.csproj src/OfacMatch.Mcp/OfacMatch.Mcp.csproj; do
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project")
            if [ "$version" != "$tag" ]; then
              echo "::error::$project has version $version but the release tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/OfacMatch --configuration Release --no-build --output artifacts
          dotnet pack src/OfacMatch.Mcp --configuration Release --no-build --output artifacts

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org username, not your email

      - name: Push to nuget.org
        shell: bash
        # Let bash expand the file list; dotnet nuget push doesn't expand "artifacts/*.nupkg" on the Windows runner.
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # One-click Claude Desktop extensions (.mcpb), attached to the release.
  # Self-contained, so users don't need .NET. Mac builds run on macOS so the binaries get signed.
  extension:
    needs: publish
    permissions:
      contents: write # attach files to the release
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: win32
            file: ofac-match-windows.mcpb
          - os: macos-latest
            rid: osx-arm64
            platform: darwin
            file: ofac-match-mac-apple-silicon.mcpb
          - os: macos-latest
            rid: osx-x64
            platform: darwin
            file: ofac-match-mac-intel.mcpb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the server
        run: >
          dotnet publish src/OfacMatch.Mcp --configuration Release --runtime ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          --output bundle/server

      - name: Write the manifest
        run: |
          rm -f bundle/server/*.xml
          cp src/OfacMatch.Mcp/mcpb/icon.png bundle/
          jq --arg version "${GITHUB_REF_NAME#v}" --arg platform "${{ matrix.platform }}" \
            '.version = $version | .compatibility.platforms = [$platform]' \
            src/OfacMatch.Mcp/mcpb/manifest.json > bundle/manifest.json

      - name: Pack
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack bundle "${{ matrix.file }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.file }}" --clobber
