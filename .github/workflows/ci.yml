name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      # .NET Framework 4.8 is only available on Windows.
      - name: Test (all frameworks)
        if: runner.os == 'Windows'
        run: dotnet test --configuration Release --no-build

      - name: Test (.NET 10)
        if: runner.os != 'Windows'
        run: dotnet test --configuration Release --no-build --framework net10.0

      - name: Pack
        if: runner.os == 'Windows'
        run: |
          dotnet pack src/OfacMatch --configuration Release --no-build --output artifacts
          dotnet pack src/OfacMatch.Mcp --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: nuget-package
          path: artifacts/*.nupkg
