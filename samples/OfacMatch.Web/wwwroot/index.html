<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OfacMatch – try OFAC name screening</title>
    <meta name="description" content="Screen a name against the OFAC SDN sanctions list in your browser and see why it matched. Free, open source, nothing is sent anywhere." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
        <noscript>OfacMatch needs JavaScript and WebAssembly to run in your browser.</noscript>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Saves text as a file on the user's computer. Nothing is sent anywhere.
        // The byte order mark makes Excel read the file as UTF-8, so accented names stay correct.
        window.ofacMatchDownload = function (fileName, text) {
            const blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        };
        // Lets the page update during a long screening. Unlike a timer, a message is not
        // slowed down to once a second when the tab is in the background.
        window.ofacMatchYield = function () {
            return new Promise(function (resolve) {
                const channel = new MessageChannel();
                channel.port1.onmessage = function () { resolve(); };
                channel.port2.postMessage(0);
            });
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
